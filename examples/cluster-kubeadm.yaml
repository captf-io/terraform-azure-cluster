# A kubeadm cluster on Azure with the CAPTF Azure modules: a
# KubeadmControlPlane, a MachineDeployment of workers and a MachinePool on a
# scale set. Apply examples/identity.yaml first.
#
#   export CLUSTER_NAME=demo NAMESPACE=team-a KUBERNETES_VERSION=v1.34.1
#   export AZURE_SUBNET_ID=/subscriptions/<id>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>/subnets/<subnet>
#   export AZURE_SSH_PUBLIC_KEY="$(cat ~/.ssh/id_ed25519.pub)"
#   export AZURE_IMAGE_ID='/communityGalleries/ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019/images/capi-ubun2-2404/versions/{semver}'
#   clusterctl generate yaml --from examples/cluster-kubeadm.yaml | kubectl apply -n "$NAMESPACE" -f -
#
# Then install a CNI and cloud-provider-azure in the workload cluster
# (README.md "Quick start"): Nodes stay NotReady and tainted until both run.
#
# The images are pinned to a release; change the tag to the release you
# deploy (README.md "Images"). The modules replace {semver} in the image ID
# with each Machine's version, so a version upgrade also upgrades the image;
# the AZURE_IMAGE_ID above is the CAPZ reference image gallery.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    # The API load balancer listens on this port and forwards to it; keep it
    # equal to the kubeadm bindPort below.
    apiServerPort: 6443
    pods:
      cidrBlocks:
      - "${POD_CIDR:=192.168.0.0/16}"
    services:
      cidrBlocks:
      - "${SERVICE_CIDR:=10.128.0.0/12}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: TerraformCluster
    name: "${CLUSTER_NAME}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  source:
    image: ghcr.io/captf-io/module-images/azure-cluster:v0.1.0-opentofu
  identityRef:
    name: "${AZURE_IDENTITY_NAME:=azure}"
  # Machines and pools without their own identityRef use this one.
  defaults:
    identityRef:
      name: "${AZURE_IDENTITY_NAME:=azure}"
  # cluster/README.md lists every variable. The API load balancer is
  # internal: the management cluster must reach the subnet's network.
  variables:
    subnet_id: "${AZURE_SUBNET_ID}"
    admin_ssh_public_key: "${AZURE_SSH_PUBLIC_KEY}"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=3}
  version: "${KUBERNETES_VERSION}"
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: TerraformMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  # A machine that fails deterministically must not be replaced forever.
  remediation:
    maxRetry: 3
    retryPeriodSeconds: 300
  kubeadmConfigSpec:
    clusterConfiguration:
      controllerManager:
        extraArgs:
        # cloud-provider-azure runs the cloud controllers.
        - name: cloud-provider
          value: external
    initConfiguration:
      localAPIEndpoint:
        bindPort: 6443
      nodeRegistration:
        # The Node is named after the VM, which cloud-provider-azure needs
        # to find it; Azure's metadata service reports the VM's hostname.
        name: '{{ ds.meta_data["local_hostname"] }}'
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
    joinConfiguration:
      controlPlane:
        localAPIEndpoint:
          bindPort: 6443
      nodeRegistration:
        name: '{{ ds.meta_data["local_hostname"] }}'
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      source:
        image: ghcr.io/captf-io/module-images/azure-machine:v0.1.0-opentofu
      # machine/README.md lists every variable.
      variables:
        image_id: "${AZURE_IMAGE_ID}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT:=2}
  # CAPI's webhook fills in the selector and the template labels.
  selector:
    matchLabels:
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: TerraformMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      source:
        image: ghcr.io/captf-io/module-images/azure-machine:v0.1.0-opentofu
      variables:
        image_id: "${AZURE_IMAGE_ID}"
        vm_size: "${AZURE_WORKER_VM_SIZE:=Standard_D4s_v5}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data["local_hostname"] }}'
          kubeletExtraArgs:
          - name: cloud-provider
            value: external
---
# Workers: InfrastructureReady=False (the module's health output) counts from
# apply start, so the timeout must exceed apply time plus one drift interval
# (30 minutes by default): 45 minutes.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: "${CLUSTER_NAME}-md-0"
  checks:
    nodeStartupTimeoutSeconds: 1200
    unhealthyMachineConditions:
    - type: InfrastructureReady
      status: "False"
      timeoutSeconds: 2700
---
# Control plane: a longer window, since replacing a control-plane machine
# costs more and kubeadm init or join does more than a worker join.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  clusterName: "${CLUSTER_NAME}"
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane: ""
  checks:
    nodeStartupTimeoutSeconds: 1800
    unhealthyMachineConditions:
    - type: InfrastructureReady
      status: "False"
      timeoutSeconds: 3600
---
# A scale set: one TerraformMachinePool for the whole group. Its template
# labels become the Nodes' labels (machinepool/README.md "Inputs").
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachinePool
metadata:
  name: "${CLUSTER_NAME}-pool-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_POOL_COUNT:=2}
  template:
    metadata:
      labels:
        node.kubernetes.io/pool: "${CLUSTER_NAME}-pool-0"
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfig
          name: "${CLUSTER_NAME}-pool-0"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: TerraformMachinePool
        name: "${CLUSTER_NAME}-pool-0"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfig
metadata:
  name: "${CLUSTER_NAME}-pool-0"
spec:
  joinConfiguration:
    nodeRegistration:
      name: '{{ ds.meta_data["local_hostname"] }}'
      kubeletExtraArgs:
      - name: cloud-provider
        value: external
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformMachinePool
metadata:
  name: "${CLUSTER_NAME}-pool-0"
  # CAPTF finds the Cluster by this label; setting it saves a reconcile.
  labels:
    cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
spec:
  source:
    image: ghcr.io/captf-io/module-images/azure-machinepool:v0.1.0-opentofu
  # machinepool/README.md lists every variable.
  variables:
    image_id: "${AZURE_IMAGE_ID}"
